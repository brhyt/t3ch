name: Upstream sync

# Merges pingdotgg/t3code main into this fork. A clean merge becomes a PR to
# review; a conflicting one becomes an issue listing the files to resolve by hand.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'pingdotgg/t3code'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SYNC_BRANCH: sync/upstream-auto
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream main

      - name: Check for new upstream commits
        id: behind
        run: echo "count=$(git rev-list --count HEAD..upstream/main)" >> "$GITHUB_OUTPUT"

      - name: Merge
        id: merge
        if: steps.behind.outputs.count != '0'
        run: |
          git switch -C "$SYNC_BRANCH"
          if git merge --no-ff --no-edit -m "chore: merge upstream t3code main" upstream/main; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git merge --abort
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the sync PR
        if: steps.merge.outputs.clean == 'true'
        run: |
          git push --force-with-lease origin "$SYNC_BRANCH"
          body="Merges ${{ steps.behind.outputs.count }} upstream commits (upstream/main $(git rev-parse --short upstream/main)). No conflicts; review and run checks before merging."
          if [ -z "$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$SYNC_BRANCH" --title "chore: sync upstream t3code" --body "$body"
          else
            gh pr edit "$SYNC_BRANCH" --body "$body"
          fi

      - name: Report conflicts
        if: steps.merge.outputs.clean == 'false'
        run: |
          title="Upstream sync needs manual conflict resolution"
          {
            echo "Merging upstream/main ($(git rev-parse --short upstream/main), ${{ steps.behind.outputs.count }} commits) conflicts in:"
            echo
            sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/conflicts.txt"
            echo
            echo 'Resolve locally: `git fetch upstream && git switch -c sync/upstream-manual main && git merge upstream/main`.'
          } > "$RUNNER_TEMP/body.md"
          existing="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
