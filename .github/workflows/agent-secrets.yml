name: Privacy checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  agent-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: node scripts/check-agent-secrets.mjs --all
      - run: node --test scripts/check-agent-secrets.test.mjs
      - run: python3 -m pip install uv==0.13.9
      - run: uv run --locked --project tools/privacy-observer python -m unittest discover -s tools/privacy-observer -v
